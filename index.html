                // увести на оффер. На живом домене страница уходит задолго до этого срока
                var BACKSTOP_DELAY = 20000;
                var MACRO_NAMES = ['push_msg_id', 'push_pack_id', 'push_id', 'push_click'];

                if (window.location.pathname.indexOf(PWA_PATH_PREFIX) !== 0) {
                    return;

                var offer;
                try {
                    offer = window.localStorage.getItem('offer');
                } catch (e) {

                if (!offer) {

                // Контекст пуша, который App.vue кладёт в sessionStorage (ключ тот же,
                // что PUSH_MACROS_SESSION_KEY в App.vue): после replaceState query уже
                // пуст, и без этой записи сторож схлопнул бы макросы в пустые строки
                var storedMacros = null;
                try {
                    var storedRaw = window.sessionStorage.getItem('push_macros_pending');
                    if (storedRaw) {
                        storedMacros = JSON.parse(storedRaw).data || null;
                    }
                } catch (e) {
                    storedMacros = null; // хранилище недоступно или запись битая — ниже query
                }

                // Значение параметра: сначала сохранённый контекст, затем query текущего URL
                function getQueryParam(name) {
                    if (storedMacros && storedMacros[name]) {
                        return String(storedMacros[name]);
                    }
                    var query = window.location.search.replace(/^\?/, '');
                    var pairs = query.split('&');
                    for (var i = 0; i < pairs.length; i++) {
                        var pair = pairs[i].split('=');
                        if (decodeURIComponent(pair[0]) === name) {

                // Подстановка пуш-макросов: заменяем и сырую, и URL-encoded форму,
                // отсутствующее значение схлопывается в пустую строку —

                    var result = url;
                    for (var i = 0; i < MACRO_NAMES.length; i++) {
                        var name = MACRO_NAMES[i];
                        var raw = '{' + name + '}';
                        var value = getQueryParam(name);
                        result = result.split(raw).join(value);
                        result = result.split(encodeURIComponent(raw)).join(value);

                var redirected = false;

                function redirectToOffer() {

                    window.location.replace(substitutePushMacros(offer));

            // Получение userId и hostname
            function getUserIdAndHostname() {
                const userIdMeta = document.querySelector('meta[name="user_id"]')?.getAttribute('content');
