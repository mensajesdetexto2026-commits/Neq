<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nequi Préstamos - Tienda de Aplicaciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="bg-[#0b0612] text-slate-100 min-h-full flex flex-col antialiased selection:bg-pink-500 selection:text-white">

  <!-- Header / Top Bar -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-[#0b0612]/80 border-b border-white/10 px-4 lg:px-8 py-3.5 transition-all">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- Logo de la pagina -->
        <div class="w-10 h-10 rounded-xl overflow-hidden border border-white/10 shadow-md">
          <img src="https://i.pinimg.com/1200x/58/a3/18/58a31898334613eb67dcad0d978d6369.jpg" alt="Logo Página" class="w-full h-full object-cover">
        </div>
        <div class="h-4 w-[1px] bg-white/20"></div>
        <span class="text-xs uppercase tracking-widest text-pink-400 font-semibold">Oficial</span>
      </div>

      <div class="flex items-center space-x-3">
        <button class="p-2 text-slate-400 hover:text-white transition-colors rounded-full hover:bg-white/5">
          <i class="fa-solid fa-magnifying-glass text-lg"></i>
        </button>
        <button class="p-2 text-slate-400 hover:text-white transition-colors rounded-full hover:bg-white/5">
          <i class="fa-solid fa-share-nodes text-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-grow max-w-4xl w-full mx-auto px-4 lg:px-8 py-6 space-y-8">

    <!-- App Header Info -->
    <section class="flex flex-col sm:flex-row items-start sm:items-center gap-5 sm:gap-6 bg-white/[0.02] p-5 sm:p-6 rounded-3xl border border-white/5 backdrop-blur-sm">
      <!-- Icono de la App -->
      <div class="relative shrink-0">
        <img id="appIcon" src="https://i.ibb.co/mrDtP2DW/405b3bfe-ec9b-4c85-b17f-76de3ef2345b-1.png" alt="Nequi Préstamos Icon" class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover shadow-2xl shadow-pink-950/40 border border-white/10">
        <div class="absolute -bottom-1 -right-1 bg-emerald-500 text-slate-950 rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-lg" title="Verificado">
          <i class="fa-solid fa-check font-bold"></i>
        </div>
      </div>

      <!-- App Metadata -->
      <div class="flex-grow space-y-2">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Nequi Préstamos</h1>
          <p class="text-pink-400 font-medium text-sm flex items-center gap-1.5 mt-0.5">
            Nequi Colombia S.A.
            <i class="fa-solid fa-circle-check text-xs"></i>
          </p>
        </div>

        <div class="flex flex-wrap items-center gap-y-1 gap-x-4 text-xs text-slate-400 pt-1">
          <span class="flex items-center gap-1 text-emerald-400 font-medium">
            <i class="fa-solid fa-shield-halved"></i> Libre de Virus
          </span>
          <span>•</span>
          <span>Finanzas</span>
          <span>•</span>
          <span>48 MB</span>
        </div>

        <!-- Rating & Downloads Bar -->
        <div class="flex items-center gap-6 pt-3 border-t border-white/5">
          <div>
            <div class="flex items-center gap-1 text-amber-400 text-sm font-bold">
              <span>4.8</span>
              <i class="fa-solid fa-star text-xs"></i>
            </div>
            <p class="text-[11px] text-slate-400">142 mil reseñas</p>
          </div>
          <div class="h-6 w-[1px] bg-white/10"></div>
          <div>
            <div class="text-sm font-bold text-
